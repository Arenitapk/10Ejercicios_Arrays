<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="../style/style_ejercicios.css">
</head>
<body>

    <img id="miGif" src="../resources/dancing-cat.gif" style="display: none;" width="300">

    <video id="videoFondo" autoplay muted loop class="videoFondo">
    <source src="../resources/fondoVideo.mp4" type="video/mp4">
    </video>

    <button onclick="activarSonido()" class="btnSonidoVideoFondo">🔊</button>

    <div class="contenedorPadre">
        <div class="informacionPrincipal">
            <h1 class="Escribe 5 numeros">Ejercicio 1</h1>
            <p>Crea un arreglo de 5 números. Usa un ciclo for para sumarlos todos y muestra el resultado con alert().</p>
            <div class="formulario">
                <input type="text" id="datoEjercicio1" placeholder="Escribe los 5 numeros aqui" class="inputEjercicio">
                <button id="btnRegistroNumeroEjercicio1" class="btnRegistroNumero">Registrar numero</button>
                <button id="btnRegresar1" class="btnRegresar" style="display: none;">Regresar</button>
            </div>
            </div>
        </div>
    </div>
    <div class="contenedorImagenPrincipal">
        <img src="../resources/gato1img.jpg" alt="gato malo1">
    </div>
    <script src="../app.js"></script>

</html>
